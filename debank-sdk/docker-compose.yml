services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DB_PATH: /data/tracker.db
      CACHE_TTL_MS: 30000
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_BASE_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
