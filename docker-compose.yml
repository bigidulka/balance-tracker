services:
  redis:
    image: redis:7-alpine
    container_name: balance-tracker-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  debank-sdk:
    build:
      context: ../debank-sdk
      dockerfile: backend/Dockerfile
    container_name: balance-tracker-debank-sdk
    environment:
      - PORT=8080
      - DB_PATH=/data/tracker.db
      - CACHE_TTL_MS=30000
      - CHAIN_CACHE_TTL_MS=21600000
    volumes:
      - debank_sdk_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-tracker-api
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_USE_SQLITE=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      debank-sdk:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-tracker-worker
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_USE_SQLITE=true
      - ENABLE_INPROCESS_REFRESH_LOOP=${ENABLE_INPROCESS_REFRESH_LOOP:-false}
      - ENABLE_WORKER=${ENABLE_WORKER:-true}
      - ENABLE_LEGACY_BACKGROUND_REFRESH_LOOP=${ENABLE_LEGACY_BACKGROUND_REFRESH_LOOP:-false}
      - ENABLE_INPROCESS_SYNC_WORKER=${ENABLE_INPROCESS_SYNC_WORKER:-true}
      - SYNC_WORKER_POLL_INTERVAL_SECONDS=${SYNC_WORKER_POLL_INTERVAL_SECONDS:-2.0}
    depends_on:
      debank-sdk:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: balance-tracker-bot
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      debank-sdk:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=http://api:8000
      - API_TOKEN=${API_TOKEN:-}
      - API_ORG_ID=${API_ORG_ID:-}
      - BOT_ADMIN_USERS=${BOT_ADMIN_USERS:-6238100241}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - HIDE_SMALL_THRESHOLD=${HIDE_SMALL_THRESHOLD:-1.0}
      - DEBANK_SDK_URL=http://debank-sdk:8080
    restart: unless-stopped

volumes:
  debank_sdk_data:
