services:
  postgres:
    image: postgres:16-alpine
    container_name: balance-tracker-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-balance_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-balance_tracker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-balance_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: balance-tracker-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  debank-sdk:
    build:
      context: ./debank-sdk
      dockerfile: backend/Dockerfile
    container_name: balance-tracker-debank-sdk
    environment:
      - PORT=8080
      - DB_PATH=/data/tracker.db
      - CACHE_TTL_MS=30000
      - CHAIN_CACHE_TTL_MS=21600000
      - PROXYCHAINS_ENABLED=1
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
    volumes:
      - debank_sdk_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-tracker-api
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_UVICORN_WORKERS:-4}"]
    mem_limit: 1024m
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_USE_SQLITE=${APP_DATABASE_USE_SQLITE:-false}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-balance_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-balance_tracker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-balance_tracker}
      - API_UVICORN_WORKERS=${API_UVICORN_WORKERS:-4}
      - DB_POOL_SIZE=${API_DB_POOL_SIZE:-8}
      - DB_MAX_OVERFLOW=${API_DB_MAX_OVERFLOW:-8}
      - DB_POOL_TIMEOUT=${API_DB_POOL_TIMEOUT:-10}
      - DEBANK_SDK_BASE_URL=${DEBANK_SDK_BASE_URL:-http://debank-sdk:8080}
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
      - ENABLE_INPROCESS_REFRESH_LOOP=false
      - ENABLE_LEGACY_BACKGROUND_REFRESH_LOOP=false
      - ENABLE_WORKER=false
      - ENABLE_INPROCESS_SYNC_WORKER=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      debank-sdk:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-tracker-worker
    mem_limit: 1536m
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_USE_SQLITE=${APP_DATABASE_USE_SQLITE:-false}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-balance_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-balance_tracker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-balance_tracker}
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${WORKER_DB_POOL_TIMEOUT:-10}
      - DEBANK_SDK_BASE_URL=${DEBANK_SDK_BASE_URL:-http://debank-sdk:8080}
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
      - ENABLE_INPROCESS_REFRESH_LOOP=${ENABLE_INPROCESS_REFRESH_LOOP:-false}
      - ENABLE_WORKER=${ENABLE_WORKER:-true}
      - ENABLE_LEGACY_BACKGROUND_REFRESH_LOOP=${ENABLE_LEGACY_BACKGROUND_REFRESH_LOOP:-false}
      - ENABLE_INPROCESS_SYNC_WORKER=${ENABLE_INPROCESS_SYNC_WORKER:-true}
      - SYNC_WORKER_POLL_INTERVAL_SECONDS=${SYNC_WORKER_POLL_INTERVAL_SECONDS:-2.0}
      - JOB_PARALLELISM=${JOB_PARALLELISM:-2}
    depends_on:
      postgres:
        condition: service_healthy
      debank-sdk:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-tracker-scheduler
    mem_limit: 512m
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_USE_SQLITE=${APP_DATABASE_USE_SQLITE:-false}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-balance_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-balance_tracker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-balance_tracker}
      - DB_POOL_SIZE=${SCHEDULER_DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${SCHEDULER_DB_MAX_OVERFLOW:-5}
      - DB_POOL_TIMEOUT=${SCHEDULER_DB_POOL_TIMEOUT:-10}
      - DEBANK_SDK_BASE_URL=${DEBANK_SDK_BASE_URL:-http://debank-sdk:8080}
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
      - ENABLE_REFRESH_SCHEDULER=${ENABLE_REFRESH_SCHEDULER:-true}
      - REFRESH_SCHEDULER_POLL_INTERVAL_SECONDS=${REFRESH_SCHEDULER_POLL_INTERVAL_SECONDS:-30}
      - REFRESH_SCHEDULER_MIN_INTERVAL_SECONDS=${REFRESH_SCHEDULER_MIN_INTERVAL_SECONDS:-60}
      - REFRESH_SCHEDULER_BATCH_SIZE=${REFRESH_SCHEDULER_BATCH_SIZE:-20}
    depends_on:
      postgres:
        condition: service_healthy
      debank-sdk:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: balance-tracker-bot
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      debank-sdk:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=http://api:8000
      - API_TOKEN=${API_TOKEN:-}
      - API_ORG_ID=${API_ORG_ID:-}
      - BOT_ADMIN_USERS=${BOT_ADMIN_USERS:-6238100241}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - HIDE_SMALL_THRESHOLD=${HIDE_SMALL_THRESHOLD:-1.0}
      - DEBANK_SDK_URL=${DEBANK_SDK_URL:-http://debank-sdk:8080}
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
      - PROXYCHAINS_ENABLED=1
      - RESOLVE_HOSTS=api,redis,debank-sdk
    restart: unless-stopped

volumes:
  debank_sdk_data:
  postgres_data:
